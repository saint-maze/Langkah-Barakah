<html lang="id">

<head>
  <meta charset="utf-8">
  <script src="three.min.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      scrollbar-gutter: stable
    }

    body {
      margin: 0;
      font-size: 15px;
      overflow-x: hidden
    }

    [hidden] {
      display: none !important
    }
  </style>
</head>

<body><canvas id="bgCanvas"
    style="position:fixed;top:0;left:0;width:100%;height:100%;max-width:100%;pointer-events:none;z-index:0;"></canvas>
  <title>Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap">
  <style>
    /* Langkah Barakah — Crimson Red (#E13A26), Deep Red (#831613), Baby Yellow (#FEED65) */
    :root {
      color-scheme: light;
      --crim: #C52818;
      --crim-raw: #E13A26;
      --deep: #831613;
      --yel-raw: #FEED65;
      --yel: #D97706;
      --bg: #F8F6F0;
      --cd: rgba(255, 255, 255, 0.90);
      --sf: rgba(255, 250, 240, 0.85);
      --cream: rgba(255, 255, 255, 0.92);
      --tx: #1C1917;
      --mu: #57534E;
      --bd: #E2DACB;
      --ink: #C52818;
      --shd: #D4C7B5;
      --line: rgba(180, 140, 75, 0.25);
      --p-border: 1px solid rgba(180, 140, 75, 0.28);
      --p-border-hover: 1px solid rgba(217, 119, 6, 0.45);
      --p-shadow: 0 8px 24px -4px rgba(100, 75, 40, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      --p-shadow-elevated: 0 16px 40px -8px rgba(100, 75, 40, 0.14), 0 4px 12px -2px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      --sh1: 0 4px 16px -2px rgba(100, 75, 40, 0.10);
      --sh2: 0 8px 32px -4px rgba(100, 75, 40, 0.14);
      --sh3: 0 24px 60px -12px rgba(80, 50, 20, 0.20);
      --org: #EA580C;
      --mat: #16A34A;
      --pos: #15803D;
      --neg: #DC2626;
      --qz: #2563EB;
      --wl: #DC2626;
      --f-d: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --f-b: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background-color: #F8F6F0;
      background-image:
        radial-gradient(1200px 700px at 50% -80px, rgba(217, 119, 6, 0.10), transparent 75%),
        radial-gradient(circle at 100% 100%, rgba(197, 40, 24, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(180, 140, 75, 0.08) 0%, transparent 50%);
      color: var(--tx);
      font: 500 15px/1.55 var(--f-b);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility
    }

    .w {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin-inline: auto;
      padding: 18px 20px 40px
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: var(--tx)
    }

    button {
      cursor: pointer;
      background: var(--cd);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      transition: transform .08s ease, background-color .12s ease
    }

    button:active:not(:disabled) {
      transform: translateY(1px)
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48
    }

    input,
    select,
    textarea {
      background: #fff;
      color: #2A0807;
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      max-width: 100%;
      font-weight: 600
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--crim);
      outline-offset: 2px
    }

    textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical
    }

    h1,
    h2,
    h3,
    .brand,
    .big,
    .big2,
    .ttlbox,
    .play,
    .endb {
      font-family: var(--f-d);
      font-weight: 800;
      letter-spacing: -.02em
    }

    h1 {
      font-size: 1.4rem;
      line-height: 1.2;
      margin: 0 0 6px;
      color: var(--deep)
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.22rem;
      line-height: 1.25;
      color: var(--deep)
    }

    h3 {
      margin: 26px 0 10px;
      font-size: 1.05rem;
      line-height: 1.3;
      color: var(--deep);
      letter-spacing: -.01em;
      padding-left: 10px;
      border-left: 4px solid var(--crim)
    }

    .mu {
      color: var(--mu);
      font-size: .88rem;
      line-height: 1.45
    }

    .sm {
      font-size: .8rem
    }

    .up {
      color: var(--pos);
      font-weight: 700
    }

    .dn {
      color: var(--neg);
      font-weight: 700
    }

    .load {
      padding: 64px 0;
      text-align: center;
      color: var(--mu);
      font-weight: 600
    }

    /* Header & Navigasi */

    /* Frosted Porcelain Glassmorphism (Blur 14px, Latar Putih Gading Kontras Tinggi) */
    .cd,
    .box,
    .tcard,
    .tabs,
    .turn,
    .fac,
    .mkc,
    .tw,
    .audio,
    .clock,
    .leg,
    .autos,
    .warn,
    .scbox {
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(180, 140, 75, 0.28);
      box-shadow: 0 8px 24px -4px rgba(100, 75, 40, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(40, 25, 20, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      overscroll-behavior: contain
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: safe center;
      gap: 18px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, rgba(131, 22, 19, 0.94) 0%, rgba(85, 12, 10, 0.94) 100%);
      color: #FFFDF7;
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid rgba(254, 237, 101, 0.32);
      border-bottom: 2px solid rgba(217, 119, 6, 0.65);
      box-shadow: 0 14px 36px -6px rgba(131, 22, 19, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      margin-bottom: 18px;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px)
    }

    .top .mu {
      color: #FFF8E1;
      font-size: .92rem;
      font-weight: 500;
      margin-top: 3px
    }

    .top .mu b {
      color: #FEED65;
      font-weight: 800
    }

    .ttl {
      font-weight: 800;
      font-size: 1.1rem
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.85rem;
      line-height: 1.05;
      color: #FEED65;
      letter-spacing: -.025em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .3)
    }

    .lb-logo {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(59, 7, 100, 0.4));
    }

    .role {
      font-size: .84rem;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      color: #FFFDF7;
      border: 1px solid rgba(255, 255, 255, 0.28);
      white-space: nowrap;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, .25);
      transition: all .15s ease;
      backdrop-filter: blur(8px)
    }

    .role:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px)
    }

    .role.adm {
      background: var(--yel-raw);
      color: var(--deep);
      border-color: rgba(217, 119, 6, .5);
      font-weight: 800
    }
    .role.fs-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFDF7;
      border-color: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      min-height: 40px;
    }
    .role.fs-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      border-color: var(--yel-raw);
      color: #FEF9C3;
    }
    .role.fs-btn.is-fs {
      background: var(--yel-raw);
      color: var(--deep);
      border-color: var(--yel);
      font-weight: 800;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      margin-bottom: 16px;
      padding: 6px 8px;
      background: var(--cd);
      border: 1px solid rgba(180, 140, 75, 0.28);
      border-radius: 12px;
      box-shadow: var(--p-shadow);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior-x: contain
    }

    .tabs::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0
    }

    .tabs button {
      flex: 0 0 auto;
      white-space: nowrap;
      font-weight: 700;
      font-size: .9rem;
      border-radius: 8px;
      padding: 8px 16px;
      border: 2px solid transparent;
      background: transparent;
      color: var(--tx);
      box-shadow: none;
      min-height: 42px;
    }

    .tabs button:hover:not(.on) {
      background: var(--sf)
    }

    .tabs button.on {
      background: var(--deep);
      color: var(--yel);
      border-color: var(--deep);
      box-shadow: 0 4px 10px -4px rgba(61, 8, 6, .6);
      font-weight: 800
    }

    /* Sub-navigasi Dek & Tombol Aksi */
    .nav3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 18px
    }

    .nav3 button {
      font-weight: 800;
      font-size: .92rem;
      padding: 12px 10px;
      color: #fff;
      border: 1px solid rgba(180, 140, 75, 0.35);
      border-radius: 10px;
      opacity: .72;
      line-height: 1.2;
      box-shadow: var(--p-shadow);
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav3 button.on {
      opacity: 1;
      outline: 3px solid var(--deep);
      outline-offset: 2px;
      transform: translateY(-1px)
    }

    .nav3.sm button {
      padding: 9px 8px;
      font-size: .84rem;
      min-height: 42px;
    }

    .nav3.n4 {
      grid-template-columns: repeat(4, 1fr)
    }

    .nav3 .wl {
      background: var(--deep)
    }

    .tb {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .tb button {
      font-weight: 700;
      min-height: 42px;
    }

    .wbtn,
    .cl,
    .rnd {
      border: 2px solid var(--shd);
      box-shadow: 0 3px 0 var(--shd);
      border-radius: 10px;
      font-weight: 800
    }

    .wbtn {
      background: var(--crim);
      color: #fff
    }

    .wbtn:hover:not(:disabled) {
      background: #c92f1d
    }

    .rule {
      margin: 8px 0;
      padding: 10px 12px;
      border-left: 4px solid var(--crim);
      background: var(--sf);
      border-radius: 8px;
      font-size: .86rem;
      color: var(--tx)
    }

    .op.off,
    .op.off:disabled {
      opacity: .48
    }

    .ln.off {
      opacity: .52;
      cursor: not-allowed
    }

    .fac.vc {
      border-color: var(--crim)
    }

    .mkc .acts {
      margin-top: 10px
    }

    .mkc .acts button {
      flex: 1 1 100px;
      padding: 8px 12px
    }

    .pos {
      --c: var(--pos)
    }

    .neg {
      --c: var(--neg)
    }

    .qz {
      --c: var(--qz)
    }

    .wl {
      --c: var(--crim)
    }

    .nav3 .pos {
      background: var(--pos)
    }

    .nav3 .neg {
      background: var(--neg)
    }

    .nav3 .qz {
      background: var(--qz)
    }

    .hd {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px
    }

    .rnd {
      background: var(--c);
      color: #fff
    }

    .gr {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 8px
    }

    .nb {
      height: 54px;
      font-weight: 800;
      font-size: 1.05rem;
      border: 2px solid var(--c);
      color: var(--c);
      border-radius: 10px;
      font-variant-numeric: tabular-nums
    }

    .nb:hover:not(.used):not(:disabled) {
      background: var(--c);
      color: #fff
    }

    .nb.used {
      opacity: .42;
      background: var(--sf);
      color: var(--mu);
      border-color: var(--bd);
      text-decoration: line-through
    }

    .nb.used:hover:not(:disabled) {
      opacity: .78;
      border-style: dashed;
      border-color: var(--c)
    }

    .nb:disabled {
      cursor: not-allowed
    }

    .nb:disabled:not(.used) {
      opacity: .5;
      background: var(--bg);
      border-style: dashed
    }

    .drw {
      margin: 0 0 14px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px dashed var(--ink);
      background: var(--cd);
      color: var(--mu);
      font-weight: 700;
      font-size: .9rem
    }

    .drw.on {
      border-style: solid;
      border-color: var(--deep);
      background: var(--deep);
      color: var(--yel)
    }

    .drw .link {
      margin-left: 6px
    }

    /* Bar Giliran & Chip */
    .turn {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      margin-bottom: 16px;
      background: var(--cd);
      border: 1px solid rgba(180, 140, 75, 0.28);
      border-radius: 14px;
      box-shadow: var(--p-shadow)
    }

    .order,
    .tsel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .tsel {
      margin-bottom: 14px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid rgba(180, 140, 75, 0.3);
      background: var(--sf);
      font-size: .86rem;
      font-weight: 700;
      line-height: 1.2;
      transition: all .12s ease
    }

    .chip.on {
      background: linear-gradient(135deg, var(--deep) 0%, #5C0E0B 100%);
      border-color: var(--yel);
      color: var(--yel-raw);
      box-shadow: 0 4px 12px -2px rgba(131, 22, 19, 0.35);
      font-weight: 800
    }

    .chip em {
      font-style: normal;
      color: var(--neg);
      font-size: .76rem;
      font-weight: 800
    }

    /* Modal & Kartu */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(20, 3, 2, .74);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      overscroll-behavior: contain
    }

    .cd {
      background: var(--cd);
      border: 1px solid rgba(180, 140, 75, 0.28);
      border-top: 6px solid var(--c);
      border-radius: 14px;
      padding: 22px;
      max-width: 560px;
      width: 100%;
      max-height: 100%;
      overflow: auto;
      box-shadow: var(--sh3)
    }

    .qd {
      --c: var(--crim);
      z-index: 30
    }

    .qd .cd {
      max-width: 420px
    }

    .qm {
      margin: 4px 0 16px;
      font-size: 1.02rem;
      font-weight: 600
    }

    .qb {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .qb .cl {
      margin: 0
    }

    .tg {
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--c);
      margin-bottom: 4px
    }

    .big {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--c);
      font-variant-numeric: tabular-nums
    }

    .big2 {
      font-size: 1.38rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--deep)
    }

    .big2 small {
      font-size: .8rem;
      font-weight: 600;
      color: var(--mu)
    }

    .op {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 12px 14px;
      line-height: 1.45;
      font-weight: 600;
      border-radius: 10px
    }

    button.op:hover:not(:disabled) {
      border-color: var(--c);
      background: var(--sf)
    }

    .op.sel {
      border-color: var(--c);
      background: color-mix(in srgb, var(--c) 14%, var(--cd));
      box-shadow: 0 2px 0 var(--c)
    }

    .op:disabled {
      opacity: 1;
      cursor: default
    }

    .ok {
      border-color: var(--pos) !important;
      background: color-mix(in srgb, var(--pos) 16%, var(--cd))
    }

    .no {
      border-color: var(--neg) !important;
      background: color-mix(in srgb, var(--neg) 16%, var(--cd))
    }

    .cl {
      background: var(--c);
      color: #fff;
      width: 100%;
      margin-top: 12px;
      padding: 10px 16px
    }

    .ghost {
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--mu);
      width: 100%;
      margin-top: 6px;
      font-size: .88rem
    }

    .rs {
      margin-top: 24px;
      text-align: center
    }

    .rs button {
      font-size: .85rem;
      color: var(--mu)
    }

    li {
      margin: 4px 0
    }

    .ln {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 8px 0;
      padding: 10px 12px;
      border: 1px solid rgba(180, 140, 75, 0.28);
      border-radius: 10px;
      cursor: pointer;
      background: var(--cd)
    }

    .ln input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: var(--crim)
    }

    .ln.on {
      border-color: var(--c);
      background: var(--sf)
    }

    /* Formulir & Input Uang */
    .fx {
      margin-top: 14px;
      padding: 16px;
      border-radius: 12px;
      background: var(--sf);
      border: 1px solid rgba(180, 140, 75, 0.28);
      box-shadow: var(--p-shadow)
    }

    .fx h4 {
      margin: 0 0 10px;
      font-size: .95rem;
      color: var(--deep)
    }

    .fr {
      display: grid;
      grid-template-columns: 1fr minmax(160px, 220px);
      gap: 6px 12px;
      align-items: center;
      margin: 10px 0
    }

    .fr>.mu {
      grid-column: 1/-1;
      font-size: .8rem;
      margin-top: -2px
    }

    .fr label {
      font-weight: 700;
      font-size: .9rem
    }

    .fr select,
    .fr input:not(.money) {
      width: 100%
    }

    .mw {
      display: flex;
      align-items: center;
      border: 1px solid rgba(180, 140, 75, 0.28);
      border-radius: 10px;
      background: #fff;
      overflow: hidden
    }

    .mw:focus-within {
      outline: 3px solid var(--crim);
      outline-offset: 1px
    }

    .mw .rpx {
      padding: 0 4px 0 10px;
      color: var(--mu);
      font-size: .88rem;
      font-weight: 700
    }

    .mw input {
      border: 0;
      border-radius: 0;
      width: 100%;
      min-width: 0;
      text-align: right;
      padding: 8px 10px 8px 4px;
      font-variant-numeric: tabular-nums;
      background: transparent;
      font-weight: 700
    }

    .mw input:focus {
      outline: none
    }

    .sgn {
      border: 0;
      border-right: 2px solid var(--ink);
      border-radius: 0;
      padding: 8px 12px;
      font-weight: 800;
      color: var(--pos);
      background: color-mix(in srgb, var(--pos) 14%, #fff)
    }

    .sgn.neg {
      color: var(--neg);
      background: color-mix(in srgb, var(--neg) 14%, #fff)
    }

    /* Modul 3D Kompas Falak / Astrolabe Terisolasi di Meja Permainan */
    .compass-stage-box {
      position: relative;
      width: clamp(86px, 27cqw, 175px);
      aspect-ratio: 1;
      flex: none;
      z-index: 2;
      margin: 0 auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #8E1814 0%, #5C0E0B 72%, #380806 100%);
      border: clamp(2.5px, 0.55cqw, 3.5px) solid var(--yel);
      border-radius: clamp(16px, 3.6cqw, 24px);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, .5), 0 clamp(2px, 0.6cqw, 4px) 0 var(--shd);
      transition: transform .12s ease, box-shadow .12s ease;
      user-select: none
    }

    .compass-stage-box:hover {
      transform: scale(1.02);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .4), 0 6px 0 var(--shd)
    }

    .compass-stage-box:active {
      transform: translateY(2px);
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, .6), 0 2px 0 var(--shd)
    }

    .compass-canvas-wrap {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .compass-canvas-wrap canvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      object-fit: contain;
    }

    .compass-badge {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--yel);
      color: var(--deep);
      border: 1.5px solid var(--shd);
      border-radius: 99px;
      padding: 2px 10px;
      font-family: var(--f-d);
      font-weight: 800;
      font-size: max(9px, 1.8cqw);
      box-shadow: 0 2px 0 var(--shd);
      pointer-events: none
    }

    .compass-val {
      font-size: max(11px, 2.2cqw);
      color: var(--crim)
    }

    .kw .compass-stage-box {
      width: 160px;
      height: 160px;
      margin: 0
    }

      }
    }

      position: relative;

 <div class="frm"><input id="nt" placeholder="Nama tim baru" onkeydown="if(event.key=='Enter')addTeam()"><button class="wbtn" onclick="addTeam()">Tambah tim</button></div></div>`;

 <div class="tw"><table class="ct"><thead><tr><th>Aset</th><th>Harga per unit/lot</th><th>Imbal hasil / sewa</th></tr></thead><tbody>${AK.map(a => `<tr><td>${AS[a].n}</td><td>${mIn("c_p_" + a, c.price[a])}</td><td>${mIn("c_v_" + a, INC.includes(a) ? c.inc[a] : c.rent[a])}<div class="mu sm">${hint[a]}</div></td></tr>`).join("")}</tbody></table></div><p class="mu sm">Saldo awal, Dana Darurat, dan Asuransi berlaku untuk tim baru dan permainan baru. Bonus lewat Start berlaku langsung. Harga, imbal hasil, dan sewa langsung berlaku.</p><button class="wbtn" onclick="saveCfg()">Simpan Konfigurasi</button></div>`;

      else if (m.type == "sell") { const T = G.teams[m.tid], own = AK.filter(a => T.assets[a].q > 0); h = `<h2>Jual aset · ${esc(T.name)}</h2><div class="pick">${own.map(a => `<button class="${a == m.a ? "on" : ""}" onclick="setSellA('${a}')">${AS[a].n} (${T.assets[a].q})</button>`).join("")}</div><div class="fr"><label for="s_q">Jumlah (${AS[m.a].u})</label>${qIn("s_q", 1, "sellPrev()")}</div><div class="fr"><span>Penyesuaian Valuasi Kartu</span><div class="adj">${[-30, -20, -15, 0, 10].map(v => `<button data-v="${v}" class="${(m.adj || 0) == v ? "on" : ""}" onclick="setAdj(${v})">${v ? pc(v) : "Normal"}</button>`).join("")}</div></div><div class="prev" id="sprev"></div><button class="cl" id="sgo" onclick="doSell()">Jual ke Bank</button>` }
      else if (m.type == "debt") { const T = G.teams[m.tid]; h = m.mode == "take" ? `<h2>Ambil Utang Qardh · ${esc(T.name)}</h2><p>Fasilitas pinjaman qardh tanpa margin hingga <b>${rp(G.cfg.debtMax)}</b> (maksimal 1 kali). Sisa kewajiban yang belum terlunasi memotong perhitungan kekayaan bersih akhir.</p><div class="fr"><label for="d_a">Nominal pinjaman</label>${mIn("d_a", G.cfg.debtMax)}</div><button class="cl" onclick="debtGo()">Tarik Qardh</button>` : `<h2>Lunasi Utang Qardh · ${esc(T.name)}</h2><p>Sisa utang <b>${rp(T.debt.out)}</b> · kas tim ${rp(T.cash)}</p><div class="fr"><label for="d_a">Nominal pelunasan</label>${mIn("d_a", Math.min(T.debt.out, Math.max(0, T.cash)))}</div><button class="cl" onclick="debtGo()">Lunasi Qardh</button>` }
      else if (m.type == "start") {
        const T = G.teams[m.tid], rows = startRows(), hasS = T.assets.saham.q > 0;
        h = `<h2>Lewat Start: ${esc(T.name)}</h2><p class="mu">Tahun pembukuan ke-${T.years + 1}.</p>${G.cfg.startBonus ? `<div class="okbox" style="margin:8px 0">Bonus melewati Start: <b>${sg(G.cfg.startBonus)}</b> masuk ke kas tim.</div>` : ""}`;
        if (hasS) h += `<div class="scbox"><div class="hd"><b>Skenario saham (diacak)</b>${ADMIN ? `<button onclick="rndSc()">↻ Acak ulang</button>` : ""}</div>${m.sc != null ? `<div class="scres ${SC[m.sc].s > 0 ? "up" : "dn"}"><b>${SC[m.sc].n} · ${sg(SC[m.sc].s * G.cfg.inc.saham)} / lot</b><div class="mu">${SC[m.sc].d}</div></div>` : ""}${ADMIN ? `<details><summary class="mu">atau pilih skenario sendiri (admin)</summary><div class="sclist">${SC.map((x, i) => `<button class="${m.sc == i ? "on" : ""}" onclick="pickSc(${i})">${x.n} <span class="${x.s > 0 ? "up" : "dn"}">${sg(x.s * G.cfg.inc.saham)}</span></button>`).join("")}</div></details>` : ""}</div>`;
        h += rows.length ? `<div class="tw"><table><thead><tr><th>Aset</th><th>Jumlah</th><th>Per unit</th><th>Total</th><th>Masuk ke</th></tr></thead><tbody>${rows.map(r => `<tr><td>${AS[r.a].n}${r.x && r.x.note ? `<div class="mu sm">${r.x.note}</div>` : ""}</td><td>${r.h.q} ${AS[r.a].u}</td><td>${r.x ? sg(r.x.per) : "?"}</td><td class="${r.tot > 0 ? "up" : r.tot < 0 ? "dn" : ""}">${r.x ? sg(r.tot) : "–"}</td><td>${r.cash ? "Kas (kupon)" : "Nilai aset"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="mu">Tim belum memiliki Sukuk, Saham, atau Reksa Dana, jadi hanya bonus Start yang dicatat. Properti menghasilkan sewa pasif saat disinggahi tim lain.</p>`;
        h += `<button class="cl" onclick="doStart()">Catat tahun ke-${T.years + 1}</button>`
      }
      else if (m.type == "rent") {
        const T = G.teams[m.tid], own = rentOwners(m);
        h = `<h2>Bayar sewa · ${esc(T.name)}</h2><p class="mu">${esc(T.name)} singgah di petak properti tim lain. Saldo kas: ${rp(T.cash)}.</p><div class="pick">${(m.lock && G.teams[m.owner] ? PROP.filter(a => G.teams[m.owner].assets[a].q > 0) : PROP).map(a => `<button class="${a == m.a ? "on" : ""}" onclick="setRentA('${a}')">${AS[a].n}</button>`).join("")}</div><div class="fr"><label for="r_o">Pemilik properti</label><select id="r_o" ${m.lock ? "disabled" : ""} onchange="setRentO(this.value)">${own.length ? own.filter(t => !m.lock || t.id == m.owner).map(t => `<option value="${t.id}" ${m.owner == t.id ? "selected" : ""}>${esc(t.name)} (${t.assets[m.a].q} ${AS[m.a].u})</option>`).join("") : `<option value="">Belum ada pemilik</option>`}</select></div><div class="fr"><label for="r_q">Jumlah unit disewa</label>${qIn("r_q", 1, "rentPrev()")}<div class="mu">Sewa ${rp(G.cfg.rent[m.a])} per ${AS[m.a].u}.</div></div><div class="prev" id="rprev"></div><button class="cl" id="rgo" onclick="doRent()">Bayar Sewa</button>`

      else if (m.type == "manual") { const opts = G.order.map(id => `<option value="${id}">${esc(tName(id))}</option>`).join(""); h = `<h2>Transaksi manual</h2><p class="mu">Untuk hal di luar kartu, seperti sewa properti, gaji, atau koreksi.</p><div class="fr"><label for="mt">Tim</label><select id="mt">${opts}</select></div><div class="fr"><label for="ma">Nominal</label>${mIn("ma", 0, { signed: 1 })}<div class="mu">+ berarti tim menerima, − berarti tim membayar.</div></div><div class="fr"><label for="mc">Lawan transaksi</label><select id="mc"><option value="">Bank</option>${opts}</select></div><div class="fr"><label for="mn">Keterangan</label><input id="mn" placeholder="Misal: sewa apartemen"></div><button class="cl" onclick="manualGo()">Catat</button>` }
      else if (m.type == "card") {

        h = `<h2>${c ? "Edit kartu" : "Kartu baru"}</h2>${!c && m.k == "tantangan" ? `<label>Jenis<select id="e_kind" onchange="U.modal.kind=this.value;rr()"><option value="tantangan" ${kind == "tantangan" ? "selected" : ""}>Tantangan (daftar efek)</option><option value="quiz" ${kind == "quiz" ? "selected" : ""}>Kuis pilihan ganda</option></select></label>` : ""}<div class="form">${cardForm(c, kind)}</div><button class="cl" onclick="saveCard()">Simpan kartu</button>`
      }
      return `<div class="ov ${cls}"><div class="cd">${h}<button class="ghost" onclick="closeModal()">Batal</button></div></div>`
    }

    /* ===== Papan Langkah Barakah: 24 petak sesuai layout, roda angka 1-8, bidak per tim (jumlah tim tidak dibatasi) ===== */
    /* Urutan 24 petak papan Langkah Barakah (indeks 1 s.d. 24) */
    const BT = [
      null,
      "start", "inv",  "pos",  "land", "neg",  "inv",  /* Petak 1-6   (Sisi Atas) */
      "fin",   "pos",  "land", "fin",  "inv",  "neg",  /* Petak 7-12  (Sisi Kanan) */
      "fin",   "pos",  "land", "inv",  "neg",  "pos",  /* Petak 13-18 (Sisi Bawah) */
      "fin",   "inv",  "land", "fin",  "land", "pos"   /* Petak 19-24 (Sisi Kiri) */
    ];
    const TT = {
      start: { n: "Start", lab: "START" },
      pos:   { n: "Kartu Positif", lab: "Positif", deck: "positif" },
      neg:   { n: "Kartu Negatif", lab: "Negatif", deck: "negatif" },
      fin:   { n: "Kartu Tantangan", lab: "Tantangan", deck: "tantangan" },
      inv:   { n: "Investasi", lab: "Investasi", only: ["sukuk", "saham", "rpu"] },
      land:  { n: "Land & Building", lab: "Land Building", only: ["apt", "rumah"] }
    };
    const IC_BASE = '<circle cx="16" cy="16" r="14" fill="#FFFDF5" stroke="#831613" stroke-width="2.5"/>';
    const IC = {
      pos: `<svg viewBox="0 0 32 32" aria-hidden="true">${IC_BASE}<path d="M16 8v16M8 16h16" stroke="#1E8E4B" stroke-width="4.5" stroke-linecap="round"/></svg>`,
      neg: `<svg viewBox="0 0 32 32" aria-hidden="true">${IC_BASE}<path d="M8 16h16" stroke="#E13A26" stroke-width="4.5" stroke-linecap="round"/></svg>`,
      fin: `<svg viewBox="0 0 32 32" aria-hidden="true">${IC_BASE}<text x="16" y="23" text-anchor="middle" font-family="Space Grotesk,Plus Jakarta Sans,sans-serif" font-weight="800" font-size="21" fill="#1E5FBF">?</text></svg>`,
      inv: `<svg viewBox="0 0 32 32" aria-hidden="true">${IC_BASE}<rect x="8" y="17" width="4.6" height="7" rx="1" fill="#D97706"/><rect x="13.7" y="12" width="4.6" height="12" rx="1" fill="#D97706"/><rect x="19.4" y="7" width="4.6" height="17" rx="1" fill="#D97706"/></svg>`,
      land: `<svg viewBox="0 0 32 32" aria-hidden="true">${IC_BASE}<path d="M7 16.5L16 8l9 8.5" fill="none" stroke="#831613" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="16" width="12" height="8" fill="#FEED65" stroke="#831613" stroke-width="1.8"/></svg>`,
      start: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="#E13A26" stroke="#831613" stroke-width="2.5"/><text x="16" y="21" text-anchor="middle" font-family="Space Grotesk,Plus Jakarta Sans,sans-serif" font-weight="800" font-size="11.5" fill="#FEED65">GO!</text></svg>`
    };
    function cellRC(k) { if (k <= 7) return [1, k]; if (k <= 12) return [k - 6, 7]; if (k <= 19) return [7, 20 - k]; return [26 - k, 1] }

    const PCOL = ["#E13A26", "#1E5FBF", "#1E8E4B", "#D97706", "#831613", "#0E8A99", "#C2185B", "#5E8C31", "#3949AB", "#B45309", "#047857", "#991B1B"], PSH = ["circle", "diamond", "square", "triangle"];
    function pawnSVG(shape, color, lab) {
      const head = { circle: '<circle cx="12" cy="8" r="5.2"/>', diamond: '<polygon points="12,1.5 18.5,8 12,14.5 5.5,8"/>', square: '<rect x="6.8" y="2.8" width="10.4" height="10.4" rx="2"/>', triangle: '<polygon points="12,2 19,14 5,14"/>' }[shape];
      const body = head + '<path d="M12 14c-3.6 3.4-5.6 8-7.4 13h14.8C17.6 22 15.6 17.4 12 14z"/><rect x="3" y="26.5" width="18" height="4.2" rx="2"/>';
      return `<svg viewBox="0 0 24 32" aria-hidden="true"><g fill="#fff" stroke="#fff" stroke-width="4.6" stroke-linejoin="round">${body}</g><g fill="${color}" stroke="#831613" stroke-width="1.8" stroke-linejoin="round">${body}</g>${lab ? `<text x="12" y="24.2" text-anchor="middle" font-family="Space Grotesk,Plus Jakarta Sans,sans-serif" font-weight="800" font-size="${String(lab).length > 1 ? 9 : 11}" fill="#fff" stroke="#831613" stroke-width="2.4" paint-order="stroke" stroke-linejoin="round">${lab}</text>` : ""}</svg>`
    }
    function tPawn(id, nl) { const i = Math.max(0, G.order.indexOf(id)); return pawnSVG(PSH[(i + Math.floor(i / 12)) % 4], PCOL[i % 12], nl ? "" : i + 1) }

        starPos[i * 3 + 2] = r * Math.cos(phi) - 6;

        const isGold = (Math.random() > 0.45);
        starCols[i * 3] = isGold ? 0.85 : 0.65;
        starCols[i * 3 + 1] = isGold ? 0.55 : 0.45;

      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));

      const pMat = new THREE.PointsMaterial({ size: 0.14, vertexColors: true, transparent: true, opacity: 0.85 });

      let mouseX = 0, mouseY = 0, curX = 0, curY = 0, lastActive = Date.now();

      window.addEventListener("mousemove", e => onPointer(e.clientX, e.clientY), { passive: true });
      window.addEventListener("touchmove", e => { if (e.touches && e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY) }, { passive: true });
      let lastGamma = null, lastBeta = null, lastOrientTime = 0;
      window.addEventListener("deviceorientation", e => {
        if (e.gamma == null || e.beta == null) return;
        const now = Date.now();

        if (lastGamma !== null && lastBeta !== null) {

        }

      }, { passive: true });

      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let animId = null, running = false, t = 0, idleCounter = 0;

      function renderFrame() {

        r2.rotation.x += 0.005; r2.rotation.y += 0.006;
        r3.rotation.y += 0.007; r3.rotation.z -= 0.005;

    function createCompassDialTexture() {
      const cv = document.createElement("canvas");
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext("2d");

      const bgGrd = ctx.createRadialGradient(256, 256, 20, 256, 256, 252);
      bgGrd.addColorStop(0, "#4A0D0B");
      bgGrd.addColorStop(0.6, "#290605");
      bgGrd.addColorStop(0.92, "#140202");
      bgGrd.addColorStop(1, "#0A0101");
      ctx.fillStyle = bgGrd;
      ctx.fillRect(0, 0, 512, 512);

      ctx.lineWidth = 12; ctx.strokeStyle = "#D89C1D";
      ctx.beginPath(); ctx.arc(256, 256, 244, 0, Math.PI * 2); ctx.stroke();

      ctx.lineWidth = 3; ctx.strokeStyle = "#FEED65";
      ctx.beginPath(); ctx.arc(256, 256, 234, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = "rgba(254,237,101,0.55)";
      for (let deg = 0; deg < 360; deg += 5) {
        const rad = deg * Math.PI / 180;
        const isMajor = (deg % 45 === 0);
        const r1 = isMajor ? 212 : 222, r2 = 232;
        ctx.lineWidth = isMajor ? 3.5 : 1.5;
        ctx.strokeStyle = isMajor ? "#FEED65" : "rgba(254,237,101,0.45)";
        ctx.beginPath();
        ctx.moveTo(256 + r1 * Math.cos(rad), 256 + r1 * Math.sin(rad));
        ctx.lineTo(256 + r2 * Math.cos(rad), 256 + r2 * Math.sin(rad));
        ctx.stroke();
      }

      // Central 8-Pointed Star (Rub el Hizb)
      ctx.save();
      ctx.translate(256, 256);
      ctx.fillStyle = "rgba(225,58,38,0.22)";
      ctx.strokeStyle = "#D89C1D"; ctx.lineWidth = 3;
      for (let i = 0; i < 2; i++) {
        ctx.rotate((Math.PI / 4) * i);
        ctx.fillRect(-64, -64, 128, 128);
        ctx.strokeRect(-64, -64, 128, 128);
      }
      ctx.restore();

      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(254,237,101,0.6)";
      ctx.beginPath(); ctx.arc(256, 256, 120, 0, Math.PI * 2); ctx.stroke();

      // 8 Stations (1 to 8)
      for (let n = 1; n <= 8; n++) {
        const deg = (n - 1) * 45;
        const rad = (deg - 90) * Math.PI / 180;
        const cx = 256 + 168 * Math.cos(rad), cy = 256 + 168 * Math.sin(rad);

        ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.fillStyle = "#FEED65"; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = "#831613"; ctx.stroke();

        ctx.font = "bold 26px 'Space Grotesk',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#831613";
        ctx.fillText(String(n), cx, cy + 1);
      }

      return new THREE.CanvasTexture(cv);
    }

        }
      }

      window.mountCompass3D = function () {
        const b1 = document.getElementById("compassContainer");
        const b2 = document.getElementById("compassContainerKw");
        const target = b1 || b2;
        if (target && !target.contains(compassCanvas)) {
          target.appendChild(compassCanvas);
          renderCompassFrame();
        }
      };

      // Micro tilt on hover (event delegation avoids layout thrashing)
      let compassHovered = false;
      document.addEventListener("pointermove", e => {
        if (isSpinning) return;
        const box = e.target && e.target.closest && e.target.closest('.compass-stage-box');
        if (!box) {
          if (compassHovered) {
            compassHovered = false;
            group.rotation.y = 0;
            group.rotation.x = 0;
            renderCompassFrame();
          }
          return;
        }
        compassHovered = true;
        const r = box.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width - 0.5;
        const ny = (e.clientY - r.top) / r.height - 0.5;
        group.rotation.y = nx * 0.45;
        group.rotation.x = -ny * 0.45;
        renderCompassFrame();
      }, { passive: true });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (compassAnimId) cancelAnimationFrame(compassAnimId);
          compassRunning = false;
        } else if (isSpinning) {
          compassRunning = true;
          compassAnimId = requestAnimationFrame(tickCompass);
        } else {
          renderCompassFrame();
        }
      });

      renderCompassFrame();
      window.mountCompass3D();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initFalakiyahBackground3D();
      initPlayCompass3D();
    });
  </script>
</body>

</html>
